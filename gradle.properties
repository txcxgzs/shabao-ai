org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom 1.10-SNAPSHOT 跟 Gradle 8.12 的 processResources + expand 在 configuration-cache 下会报
# "Cannot reference a Gradle script object from a Groovy closure"，先关掉 config-cache 让 build 跑通
org.gradle.configuration-cache=false

minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
loom_version=1.10-SNAPSHOT
fabric_version=0.116.15+1.21.1
# 模组配置 UI 相关依赖：ModMenu 提供"模组 -> 配置"入口，Cloth Config 提供表单渲染
# 版本号固定 1.21.1 兼容的稳定版，避免 Minecraft 版本漂移导致 API 不匹配
modmenu_version=11.0.2
cloth_config_version=15.0.140

mod_version=0.1.0
maven_group=cn.shabaoai
archives_base_name=shabao-ai-companion

# 内测版授权有效期（天）：internalJar 产物的时间锁，默认 30 天后过期锁定 AI
internal_expire_days=30

# 加密公测版授权有效期（天）：publicBetaRelease 产物的时间锁，默认 90 天后到期
public_beta_expire_days=90
